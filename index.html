<style>
html,body{margin:0;padding:0;background:#FBF9F4}

  #app{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;background:#FBF9F4;color:#14213D;min-height:100vh;padding:0;box-sizing:border-box}
  #app *{box-sizing:border-box}
  .mono{font-family:ui-monospace,'SFMono-Regular','Roboto Mono',Menlo,Consolas,monospace}
  .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8A8272;font-weight:600}
  .btn{border:1px solid #14213D;background:#14213D;color:#FBF9F4;padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}

  .btn-ghost:hover{background:#F3EFE6}

<body>
<div id="app"><div style="padding:60px 20px;text-align:center;color:#8A8272">Cargando bitácora...</div></div>
<script>
(function(){
  var STORAGE_KEY = 'bitacora-data';
  var CURRENCIES = ['MXN','AUD','GBP','USD','EUR'];
  var SYMBOLS = {MXN:'$',AUD:'A$',GBP:'£',USD:'US$',EUR:'€'};
  var EXPENSE_CATS = ['Comida','Transporte','Renta','Servicios','Salud','Entretenimiento','Compras','Viajes','Otros'];
  var INCOME_CATS = ['Sueldo/Shifts','Freelance','Kivo / LoopOff','Otro ingreso'];
  var TAGS = ['#0F6E66','#B8860B','#B23A2E','#3E5C76','#7A5C61','#4A6B3E'];

  var S = null;
  var activeTab = 'dashboard';
  var dashMonth = new Date().toISOString().slice(0,7);
  var importState = null;

  function uid(){ return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8); }

  var SCHEMA_VERSION = 5;

  function knownRatesFor(name){
    if(name==="Betty's") return {weekday:34.76, eveningThresholdHour:22, weekdayEvening:37.54, lateNight:38.93, saturday:41.72, sunday:41.72, publicHoliday:69.53};
    if(name==='B&W') return {weekday:33.85, eveningThresholdHour:19, weekdayEvening:36.80, lateNight:38.28, saturday:40.62, sunday:47.39, publicHoliday:67.72};
    return null;
  }

  // Reconstructed real shift history (from calendar + real payslips), reused by defaultState and by the repair migration
  function seedShiftsFor(bettysId, bwId){
    return [
      // ---- Betty's: confirmados por payslip real, ya pagados ----
      {id:uid(), jobId:bettysId, date:'2026-08-10', startTime:'10:00', endTime:'13:00', note:'Training online (7 módulos) — payslip real $104.29', paid:true},
      {id:uid(), jobId:bettysId, date:'2026-08-13', startTime:'16:00', endTime:'19:00', note:'Primer turno — payslip real $105.33', paid:true},
      {id:uid(), jobId:bettysId, date:'2026-08-18', startTime:'18:00', endTime:'22:30', note:'Grill — payslip real $156.23', paid:true},
      {id:uid(), jobId:bettysId, date:'2026-08-26', startTime:'17:30', endTime:'22:00', note:'Training Grill 2 — payslip real $155.39, paga 3 sep, aún no cae', paid:false},
      {id:uid(), jobId:bettysId, date:'2026-08-29', startTime:'17:30', endTime:'22:00', note:'Grill 1 sábado — payslip real $195.23, paga 3 sep, aún no cae', paid:false},
      {id:uid(), jobId:bettysId, date:'2026-08-30', startTime:'12:00', endTime:'17:30', note:'Grill 1 domingo — payslip real $233.60, paga 3 sep, aún no cae', paid:false},
      // ---- Betty's: aún sin payslip ----
      {id:uid(), jobId:bettysId, date:'2026-09-02', startTime:'18:00', endTime:'22:00', note:'Training Grill 2', paid:false},
      {id:uid(), jobId:bettysId, date:'2026-09-04', startTime:'12:00', endTime:'15:00', note:'Training Grill 1', paid:false},
      // ---- B&W: confirmados por payslip real, ya pagados ----
      {id:uid(), jobId:bwId, date:'2026-08-08', startTime:'13:45', endTime:'18:30', note:'SCG Retail @Merivale — payslip real $192.95', paid:true},
      {id:uid(), jobId:bwId, date:'2026-08-14', startTime:'16:00', endTime:'21:30', note:'Opera House — Padel Invitational (Gucci) — payslip real $193.55', paid:true},
      {id:uid(), jobId:bwId, date:'2026-08-15', startTime:'15:00', endTime:'20:30', note:'SBW Opera House — cubriste horas completas — payslip real $223.41', paid:true},
      // ---- B&W: aún sin payslip ----
      {id:uid(), jobId:bwId, date:'2026-08-23', startTime:'13:45', endTime:'18:00', note:'SFS Retail @Merivale — Island Bar', paid:false},
      {id:uid(), jobId:bwId, date:'2026-08-28', startTime:'17:30', endTime:'23:30', note:'Cloak Attendant — Machine Hall', paid:false},
      {id:uid(), jobId:bwId, date:'2026-09-01', startTime:'16:30', endTime:'22:00', note:'Machine Hall', paid:false},
      {id:uid(), jobId:bwId, date:'2026-09-05', startTime:'13:45', endTime:'17:45', note:'Victor Trumper — SCG', paid:false}
    ];
  }

  function defaultState(){
    var bettysId = uid();
    var bwId = uid();
    var revolutId = uid(), nuId = uid(), bbvaId = uid(), commbankId = uid();
    return {
      schemaVersion: SCHEMA_VERSION,
      baseCurrency: 'MXN',
      rates: {MXN:1, AUD:12.3, GBP:23.5, USD:18.4, EUR:20.0},
      accounts: [
        {id:revolutId, name:'Revolut', currency:'AUD', tag:TAGS[0]},
        {id:nuId, name:'Nu', currency:'MXN', tag:TAGS[1]},
        {id:bbvaId, name:'BBVA', currency:'MXN', tag:TAGS[2]},
        {id:commbankId, name:'CommBank', currency:'AUD', tag:TAGS[3]}
      ],
      transactions: [],
      goals: [],
      pending: [
        {id:uid(), kind:'out', concept:'Renta semanal', amount:360, currency:'AUD', accountId:commbankId, dueDate:'2026-08-31', status:'open', recurrence:'weekly'},
        {id:uid(), kind:'out', concept:'BBVA — pago para no generar intereses (revisar monto cada mes en el nuevo estado de cuenta)', amount:15361.95, currency:'MXN', accountId:bbvaId, dueDate:'2026-09-10', status:'open', recurrence:'monthly'}
      ],
      shifts: seedShiftsFor(bettysId, bwId),
      jobs: [
        {id:bettysId, name:"Betty's", currency:'AUD', taxRate:0.16, payDelayDays:4, tag:TAGS[1], rates:knownRatesFor("Betty's")},
        {id:bwId, name:'B&W', currency:'AUD', taxRate:0.16, payDelayDays:10, tag:TAGS[3], rates:knownRatesFor('B&W')}
      ]
    };
  }

  var persistOk = true;
  var backend = null; // 'claude' | 'local' | null

  function hasStorage(){
    return typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function' && typeof window.storage.set === 'function';
  }

  function detectBackend(){
    if(hasStorage()) return 'claude';
    try{
      if(typeof localStorage !== 'undefined'){
        localStorage.setItem('__bitacora_test__','1');
        localStorage.removeItem('__bitacora_test__');
        return 'local';
      }
    }catch(e){}
    return null;
  }

  function save(){
    if(backend==='claude'){
      try{
        window.storage.set(STORAGE_KEY, JSON.stringify(S), false).catch(function(e){ console.error('save failed', e); });
      }catch(e){ console.error('save error', e); }
    } else if(backend==='local'){
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); }
      catch(e){ console.error('local save error', e); }
    }
  }

  function load(){
    backend = detectBackend();
    if(backend==='claude'){
      try{
        window.storage.get(STORAGE_KEY, false).then(function(res){
          S = res && res.value ? JSON.parse(res.value) : defaultState();
          ensureShape();
          render();
        }).catch(function(){
          S = defaultState();
          ensureShape();
          render();
        });
      }catch(e){
        S = defaultState();
        ensureShape();
        render();
      }
    } else if(backend==='local'){
      try{
        var raw = localStorage.getItem(STORAGE_KEY);
        S = raw ? JSON.parse(raw) : defaultState();
      }catch(e){ S = defaultState(); }
      ensureShape();
      render();
    } else {
      persistOk = false;
      S = defaultState();
      render();
    }
  }

  function ensureShape(){
    var d = defaultState();
    if(!S.baseCurrency) S.baseCurrency = d.baseCurrency;
    if(!S.rates) S.rates = d.rates;
    if(!S.accounts || !S.accounts.length) S.accounts = d.accounts;
    if(!S.transactions) S.transactions = [];
    if(!S.goals) S.goals = [];
    if(!S.pending) S.pending = [];
    if(!S.jobs) S.jobs = d.jobs;
    if(!S.shifts) S.shifts = [];
    S.pending.forEach(function(p){ if(!p.recurrence) p.recurrence = 'none'; });
    S.shifts.forEach(function(s){ if(typeof s.paid !== 'boolean') s.paid = false; });
    S.jobs.forEach(function(j){
      if(!j.rates){
        // migrate old flat hourlyRate jobs into the tiered schema (same rate everywhere until edited)
        var r = j.hourlyRate || 0;
        j.rates = {weekday:r, eveningThresholdHour:19, weekdayEvening:r, lateNight:r, saturday:r, sunday:r, publicHoliday:r};
        delete j.hourlyRate;
      }
      if(j.payDelayDays==null){
        j.payDelayDays = j.payLagDays!=null ? j.payLagDays : 7;
      }
      delete j.payLagDays;
    });

    // ---- Repair migration: fixes browsers that had old data saved before the rate-tier rework ----
    if(!S.schemaVersion || S.schemaVersion < SCHEMA_VERSION){
      S.jobs.forEach(function(j){
        var kr = knownRatesFor(j.name);
        if(kr) j.rates = kr; // overwrite whatever got flattened by the old bug with the real tiered rates
        if(j.name==="Betty's") j.payDelayDays = 4;   // paid Thursday, 4 days after the week's Sunday
        if(j.name==='B&W') j.payDelayDays = 10;      // paid Wednesday, 10 days after the week's Sunday
      });
      var bettysJob = S.jobs.find(function(j){return j.name==="Betty's";});
      var bwJob = S.jobs.find(function(j){return j.name==='B&W';});
      if(bettysJob && bwJob){
        seedShiftsFor(bettysJob.id, bwJob.id).forEach(function(seed){
          var exists = S.shifts.some(function(s){ return s.jobId===seed.jobId && s.date===seed.date; });
          if(!exists) S.shifts.push(seed);
        });
      }
      if(!S.pending.some(function(p){ return p.concept==='Renta semanal'; })){
        var commbank = S.accounts.find(function(a){return a.name==='CommBank';});
        S.pending.push({id:uid(), kind:'out', concept:'Renta semanal', amount:360, currency:'AUD', accountId: commbank?commbank.id:S.accounts[0].id, dueDate:'2026-08-31', status:'open', recurrence:'weekly'});
      }
      if(!S.pending.some(function(p){ return p.concept.indexOf('BBVA')===0; })){
        var bbva = S.accounts.find(function(a){return a.name==='BBVA';});
        S.pending.push({id:uid(), kind:'out', concept:'BBVA — pago para no generar intereses (revisar monto cada mes en el nuevo estado de cuenta)', amount:15361.95, currency:'MXN', accountId: bbva?bbva.id:S.accounts[0].id, dueDate:'2026-09-10', status:'open', recurrence:'monthly'});
      }

      // v3: dedupe shifts left behind by the old buggy migration (legacy hours-only entries
      // alongside the new startTime/endTime ones for the same job+date) — keep the complete one.
      var bestByKey = {};
      S.shifts.forEach(function(s){
        var key = s.jobId+'|'+s.date;
        var cur = bestByKey[key];
        var thisComplete = !!(s.startTime && s.endTime);
        if(!cur || (thisComplete && !(cur.startTime && cur.endTime))) bestByKey[key] = s;
      });
      S.shifts = Object.keys(bestByKey).map(function(k){ return bestByKey[k]; });

      // The Betty's payslip for 24-30 Aug (net $472.06) is dated 3 Sep but hasn't actually
      // landed in the bank yet — un-mark those shifts as paid until confirmed via "Ya cobré".
      var stillOwed = ['2026-08-26','2026-08-29','2026-08-30'];
      S.shifts.forEach(function(s){
        var job = jobById(s.jobId);
        if(job && job.name==="Betty's" && stillOwed.indexOf(s.date)!==-1) s.paid = false;
      });

      S.schemaVersion = SCHEMA_VERSION;
      save();
    }
  }

  function jobById(id){ return S.jobs.find(function(j){return j.id===id;}); }
  function shiftById(id){ return S.shifts.find(function(s){return s.id===id;}); }

  function addDays(dateStr, days){
    var d = new Date(dateStr+'T00:00:00');
    d.setDate(d.getDate()+days);
    return d.toISOString().slice(0,10);
  }
  function addMonths(dateStr, months){
    var d = new Date(dateStr+'T00:00:00');
    d.setMonth(d.getMonth()+months);
    return d.toISOString().slice(0,10);
  }
  function startOfWeek(dateStr){
    var d = new Date(dateStr+'T00:00:00');
    var day = d.getDay(); // 0=Sun..6=Sat
    var diff = (day===0 ? -6 : 1-day); // Monday-based week
    d.setDate(d.getDate()+diff);
    return d.toISOString().slice(0,10);
  }
  function weekRange(anchorDate){
    var start = startOfWeek(anchorDate || todayStr());
    var end = addDays(start,6);
    return {start:start, end:end};
  }

  // ---- Rate-tier pay calculation (weekday base / weekday evening / late night / sábado / domingo / festivo) ----
  function timeToDec(hhmm){
    if(!hhmm) return null;
    var parts = hhmm.split(':');
    return parseInt(parts[0],10) + (parseInt(parts[1],10)||0)/60;
  }
  function shiftHours(shift){
    if(shift.startTime && shift.endTime){
      var s = timeToDec(shift.startTime), e = timeToDec(shift.endTime);
      if(e<=s) e += 24;
      return e - s;
    }
    return shift.hours || 0;
  }
  // Splits a weekday shift's hours across base / evening / late-night tiers, mirroring real payslips
  function computeShiftGross(job, dateStr, shift){
    var rates = job.rates || {};
    if(shift.isHoliday) return shiftHours(shift) * (rates.publicHoliday||0);
    var dow = new Date(dateStr+'T00:00:00').getDay(); // 0=Sun..6=Sat
    if(!shift.startTime || !shift.endTime){
      // legacy shift without clock times: use flat rate for that day-type
      var flatRate = dow===6 ? rates.saturday : dow===0 ? rates.sunday : rates.weekday;
      return shiftHours(shift) * (flatRate||0);
    }
    var s = timeToDec(shift.startTime), e = timeToDec(shift.endTime);
    if(e<=s) e += 24;
    if(dow===6) return (e-s) * (rates.saturday||0);
    if(dow===0) return (e-s) * (rates.sunday||0);
    var thr = (rates.eveningThresholdHour!=null ? rates.eveningThresholdHour : 19);
    var preEvening = Math.max(0, Math.min(e,thr) - s);
    var evening = Math.max(0, Math.min(e,24) - Math.max(s,thr));
    var lateNight = Math.max(0, e - Math.max(s,24));
    return preEvening*(rates.weekday||0) + evening*(rates.weekdayEvening||0) + lateNight*(rates.lateNight||0);
  }

  // Real payslips pay per weekly period (Mon-Sun), not per individual shift — all shifts in the
  // same pay week land on the SAME payday, N days after that week's Sunday.
  function periodEndFor(dateStr){
    var d = new Date(dateStr+'T00:00:00');
    var toSunday = (7 - d.getDay()) % 7; // 0 if dateStr is already a Sunday
    d.setDate(d.getDate()+toSunday);
    return d.toISOString().slice(0,10);
  }

  // Expected net pay + expected pay date for a logged shift, based on its job's rate schedule/tax/pay cycle
  function shiftPay(shift){
    var job = jobById(shift.jobId);
    if(!job) return {gross:0, net:0, currency:S.baseCurrency, payDate:shift.date};
    var gross = computeShiftGross(job, shift.date, shift);
    var net = gross * (1 - (job.taxRate||0));
    var payDate = addDays(periodEndFor(shift.date), job.payDelayDays!=null ? job.payDelayDays : 7);
    return {gross:gross, net:net, currency:job.currency, payDate: payDate};
  }

  // Expand pending items (including recurring ones) into concrete dated occurrences up to windowEnd
  function occFromPending(p, date){
    return {id:p.id+'@'+date, sourceId:p.id, concept:p.concept, kind:p.kind, amount:p.amount, currency:p.currency, accountId:p.accountId, dueDate:date, recurrence:p.recurrence};
  }
  function expandPendingOccurrences(windowEnd){
    var out = [];
    S.pending.filter(function(p){return p.status==='open';}).forEach(function(p){
      if(!p.recurrence || p.recurrence==='none'){
        if(p.dueDate<=windowEnd) out.push(occFromPending(p,p.dueDate));
        return;
      }
      var d = p.dueDate, guard=0;
      while(d<=windowEnd && guard<520){
        out.push(occFromPending(p,d));
        d = p.recurrence==='weekly' ? addDays(d,7) : addMonths(d,1);
        guard++;
      }
    });
    return out;
  }

  function convert(amount, from, to){
    if(from === to) return amount;
    var mxn = from === 'MXN' ? amount : amount * (S.rates[from]||1);
    return to === 'MXN' ? mxn : mxn / (S.rates[to]||1);
  }

  function fmt(amount, currency){
    try{
      return new Intl.NumberFormat('es-MX', {style:'currency', currency: currency||'MXN', maximumFractionDigits:0}).format(amount);
    }catch(e){
      return (SYMBOLS[currency]||'$') + Math.round(amount).toLocaleString();
    }
  }

  function accountById(id){ return S.accounts.find(function(a){return a.id===id;}); }
  function goalById(id){ return S.goals.find(function(g){return g.id===id;}); }

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  // ---------- render dispatch ----------
  function render(){
    var html = '';
    html += renderHeader();
    if(activeTab==='dashboard') html += renderDashboard();
    else if(activeTab==='turnos') html += renderTurnos();
    else if(activeTab==='pendientes') html += renderPendientes();
    else if(activeTab==='proyeccion') html += renderProyeccion();
    else if(activeTab==='movimientos') html += renderMovimientos();
    else if(activeTab==='metas') html += renderMetas();
    else if(activeTab==='cuentas') html += renderCuentas();
    document.getElementById('app').innerHTML = html;
    bindEvents();
    if(activeTab==='proyeccion') drawBalanceChart();
  }

  function renderHeader(){
    var tabs = [['dashboard','Panel'],['turnos','Turnos'],['pendientes','Pendientes'],['proyeccion','Proyección'],['movimientos','Movimientos'],['metas','Metas'],['cuentas','Cuentas']];
    var tabHtml = tabs.map(function(t){
      var active = activeTab===t[0];
      return '<button data-tab="'+t[0]+'" style="padding:10px 4px;margin-right:22px;background:none;border:none;cursor:pointer;font-size:13px;font-weight:600;color:'+(active?'#14213D':'#A39C8C')+';border-bottom:2px solid '+(active?'#0F6E66':'transparent')+'">'+t[1]+'</button>';
    }).join('');
    var banner = persistOk ? '' : '<div style="max-width:900px;margin:14px auto 0;padding:10px 14px;background:#FBECE9;border:1px solid #E8B8AF;border-radius:8px;font-size:12px;color:#8A3226">No se detectó guardado automático en este navegador (revisa que no est&#233;s en modo privado/incógnito) — tus datos se van a perder al recargar.</div>';
    return ''+banner+
    '<div style="max-width:900px;margin:0 auto;padding:28px 20px 0">'+
      '<div style="display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px">'+
        '<div>'+
          '<div class="eyebrow">Registro de vuelo financiero</div>'+
          '<div style="font-size:26px;font-weight:700;letter-spacing:-.01em">Bitácora</div>'+
        '</div>'+
        '<div class="mono" style="font-size:12px;color:#8A8272">Moneda base: '+S.baseCurrency+'</div>'+
      '</div>'+
      '<div style="display:flex;margin-top:18px;border-bottom:1px solid #E9E3D5">'+tabHtml+'</div>'+
    '</div>'+
    '<div style="max-width:900px;margin:0 auto;padding:22px 20px 60px">';
  }

  // close wrapper div added in header; append at end of each tab render, plus close outer
  function wrapClose(inner){ return inner + '</div>'; }

  // ---------- DASHBOARD ----------
  function monthTx(){
    return S.transactions.filter(function(t){ return t.date.slice(0,7)===dashMonth; });
  }

  // ---------- ESTA SEMANA (turnos + pendientes que caen en la semana actual) ----------
  function thisWeekItems(){
    var wk = weekRange();
    var items = [];

    S.shifts.filter(function(s){ return !s.paid; }).forEach(function(s){
      var pay = shiftPay(s);
      if(pay.payDate >= wk.start && pay.payDate <= wk.end){
        var job = jobById(s.jobId);
        items.push({
          label: (job?job.name:'Turno')+' · '+s.date+(s.note?' · '+s.note:''),
          date: pay.payDate, kind:'in',
          amount: convert(pay.net, pay.currency, S.baseCurrency)
        });
      }
    });

    expandPendingOccurrences(wk.end).forEach(function(o){
      if(o.dueDate >= wk.start && o.dueDate <= wk.end){
        items.push({
          label: o.concept + (o.recurrence!=='none' ? ' (recurrente)' : ''),
          date: o.dueDate, kind:o.kind,
          amount: convert(o.amount, o.currency, S.baseCurrency)
        });
      }
    });

    items.sort(function(a,b){ return a.date.localeCompare(b.date); });
    return {range: wk, items: items};
  }

  function renderThisWeek(){

  function renderDashboard(){
    var tx = monthTx();
    var income=0, expense=0, saving=0;
    tx.forEach(function(t){
      var v = convert(t.amount, t.currency, S.baseCurrency);
      if(t.type==='income') income+=v;
      else if(t.type==='expense') expense+=v;
      else if(t.type==='saving') saving+=v;
    });
    var net = income - expense - saving;

    var byCat = {};
    tx.filter(function(t){return t.type==='expense';}).forEach(function(t){
      var v = convert(t.amount, t.currency, S.baseCurrency);
      byCat[t.category] = (byCat[t.category]||0) + v;
    });
    var catRows = Object.keys(byCat).map(function(k){return [k,byCat[k]];}).sort(function(a,b){return b[1]-a[1];});
    var maxCat = catRows.length ? catRows[0][1] : 1;

    var accCards = S.accounts.map(function(a){
      var bal = S.transactions.filter(function(t){return t.accountId===a.id;}).reduce(function(sum,t){
        var sign = t.type==='income' ? 1 : -1;
        return sum + sign*t.amount;
      }, 0);
      return '<div class="card" style="border-left:3px solid '+a.tag+';border-radius:8px">'+
        '<div class="eyebrow">'+esc(a.name)+'</div>'+
        '<div class="mono" style="font-size:19px;font-weight:600;margin-top:4px">'+fmt(bal, a.currency)+'</div>'+
        '</div>';
    }).join('');

    var out = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">'+
      '<input type="month" value="'+dashMonth+'" id="dashMonthInput" style="width:auto"/>'+
      '</div>';

    out += renderThisWeek();

    out += '<div class="eyebrow" style="margin-bottom:10px">Resumen del mes</div>';
    out += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px">'+
      metricCard('Ingresos', fmt(income, S.baseCurrency), '#0F6E66')+
      metricCard('Egresos', fmt(expense, S.baseCurrency), '#B23A2E')+
      metricCard('A ahorro', fmt(saving, S.baseCurrency), '#B8860B')+
      metricCard('Neto del mes', fmt(net, S.baseCurrency), net>=0?'#0F6E66':'#B23A2E')+
    '</div>';

    out += '<div class="eyebrow" style="margin-bottom:10px">Saldo por cuenta</div>';
    out += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:26px">'+accCards+'</div>';

    out += '<div class="eyebrow" style="margin-bottom:10px">Gasto por categoría este mes</div>';
    if(catRows.length===0){
      out += emptyState('Sin gastos registrados este mes.', 'Agrega tu primer movimiento en la pestaña Movimientos.');
    } else {
      out += '<div class="card">' + catRows.map(function(r){
        var pct = Math.round((r[1]/maxCat)*100);
        return '<div style="margin-bottom:10px">'+
          '<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px">'+
            '<span>'+esc(r[0])+'</span><span class="mono">'+fmt(r[1], S.baseCurrency)+'</span>'+
          '</div>'+
          '<div style="height:6px;background:#F0ECE0;border-radius:3px overflow:hidden"><div style="height:6px;width:'+pct+'%;background:#B23A2E;border-radius:3px"></div></div>'+
        '</div>';
      }).join('') + '</div>';
    }

    return wrapClose(out);
  }

  // ---------- TURNOS ----------
  function renderTurnos(){
    var out = '';
    if(S.jobs.length===0){
      out += emptyState('No tienes trabajos configurados.', 'Agrega uno en Cuentas → Trabajos (nombre, tarifa/hora, % impuesto, días de retraso) antes de registrar turnos.');
      return wrapClose(out);
    }

    out += '<div class="card" style="margin-bottom:20px">'+
      '<div class="eyebrow" style="margin-bottom:12px">Registrar turno</div>'+
      '<form id="shiftForm">'+
        '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:10px">'+
          '<div><label>Trabajo</label><select name="jobId">'+S.jobs.map(function(j){return '<option value="'+j.id+'">'+esc(j.name)+'</option>';}).join('')+'</select></div>'+
          '<div><label>Fecha del turno</label><input type="date" name="date" value="'+todayStr()+'" required/></div>'+
          '<div><label>Hora inicio (pagada)</label><input type="time" name="startTime" required/></div>'+
          '<div><label>Hora fin</label><input type="time" name="endTime" required/></div>'+
          '<div><label>Nota (opcional)</label><input type="text" name="note" placeholder="Ej. Machine Hall"/></div>'+
        '</div>'+
        '<label style="display:flex;align-items:center;gap:6px;margin-bottom:10px;text-transform:none;font-size:13px;color:#14213D">'+
          '<input type="checkbox" name="isHoliday" style="width:auto"/> Es día festivo (public holiday)'+
        '</label>'+
        '<button type="submit" class="btn">Registrar turno</button>'+
      '</form>'+
    '</div>';

    var shifts = S.shifts.slice();
    var pendingCount = shifts.filter(function(s){return !s.paid;}).length;

    out += '<div class="eyebrow" style="margin-bottom:10px">Turnos registrados ('+pendingCount+' por cobrar)</div>';
    if(shifts.length===0){
      out += emptyState('Sin turnos registrados todavía.', 'Regístralos aquí conforme trabajes para que el Panel sepa cuánto vas a recibir cada semana.');
      return wrapClose(out);
    }

    // ---- Resumen: cuánto vas a recibir ESTA semana, por fecha de pago (no fecha de turno) ----
    var wk = weekRange();
    var dueThisWeek = shifts.filter(function(s){
      if(s.paid) return false;
      var pay = shiftPay(s);
      return pay.payDate >= wk.start && pay.payDate <= wk.end;
    });
    var totalThisWeek = dueThisWeek.reduce(function(sum,s){
      var pay = shiftPay(s);
      return sum + convert(pay.net, pay.currency, S.baseCurrency);
    }, 0);
    var byJobThisWeek = {};
    dueThisWeek.forEach(function(s){
      var job = jobById(s.jobId);
      var pay = shiftPay(s);
      var v = convert(pay.net, pay.currency, S.baseCurrency);
      byJobThisWeek[job?job.name:'—'] = (byJobThisWeek[job?job.name:'—']||0) + v;
    });

    out += '<div class="card" style="margin-bottom:20px;border-color:#0F6E66">'+
      '<div class="eyebrow" style="margin-bottom:8px">Esta semana ('+wk.start+' a '+wk.end+') vas a recibir</div>'+
      '<div class="mono" style="font-size:26px;font-weight:700;color:#0F6E66;margin-bottom:6px">'+fmt(totalThisWeek, S.baseCurrency)+'</div>'+
      (Object.keys(byJobThisWeek).length ?
        '<div style="font-size:12px;color:#8A8272">'+Object.keys(byJobThisWeek).map(function(name){ return esc(name)+': '+fmt(byJobThisWeek[name], S.baseCurrency); }).join(' · ')+'</div>'
        : '<div style="font-size:12px;color:#8A8272">Nada programado para caer esta semana según las fechas de pago.</div>')+
    '</div>';

    // ---- Una tabla por trabajo, ordenada por fecha de PAGO (no fecha de turno) ----
    out += S.jobs.map(function(job){
      var jobShifts = shifts.filter(function(s){ return s.jobId===job.id; })
        .map(function(s){ return {s:s, pay:shiftPay(s)}; })
        .sort(function(a,b){ return b.pay.payDate.localeCompare(a.pay.payDate); });

      if(jobShifts.length===0) return '';

      var pendingNet = 0, paidNet = 0;
      jobShifts.forEach(function(x){
        var v = convert(x.pay.net, x.pay.currency, S.baseCurrency);
        if(x.s.paid) paidNet += v; else pendingNet += v;
      });

      var rows = jobShifts.map(function(x){
        var s = x.s, pay = x.pay;
        var timeLabel = (s.startTime&&s.endTime) ? (s.startTime+'–'+s.endTime) : '';
        var inThisWeek = !s.paid && pay.payDate>=wk.start && pay.payDate<=wk.end;
        return '<div style="padding:12px 16px;border-bottom:1px solid #F0ECE0;'+(s.paid?'opacity:.5':'')+(inThisWeek?'background:#F3F9F7':'')+'">'+
          '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">'+
            '<div>'+
              '<div style="font-size:13px;font-weight:600">Trabajaste el '+s.date+(timeLabel?' ('+timeLabel+')':'')+(s.isHoliday?' · festivo':'')+'</div>'+
              '<div style="font-size:13px;font-weight:700;color:'+(s.paid?'#8A8272':'#0F6E66')+';margin-top:2px">→ '+(s.paid?'Cobraste el ':'Cobras el ~')+pay.payDate+'</div>'+
              (s.note ? '<div style="font-size:11px;color:#8A8272;margin-top:2px">'+esc(s.note)+'</div>' : '')+
            '</div>'+
            '<div style="display:flex;align-items:center;gap:10px">'+
              '<div class="mono" style="font-weight:700;color:#0F6E66">'+fmt(convert(pay.net,pay.currency,S.baseCurrency), S.baseCurrency)+'</div>'+
              (s.paid ? '' : '<button class="btn-ghost" data-paid-shift="'+s.id+'">Ya cobré</button>')+
              '<button class="btn-danger" data-del-shift="'+s.id+'">Eliminar</button>'+
            '</div>'+
          '</div>'+
          '<div class="mono" style="font-size:11px;color:#8A8272;margin-top:4px">'+fmt(pay.gross, pay.currency)+' bruto / '+fmt(pay.net, pay.currency)+' neto est.</div>'+
        '</div>';
      }).join('');

      return '<div class="eyebrow" style="margin:18px 0 8px">'+esc(job.name)+
        ' <span style="font-weight:400;text-transform:none;letter-spacing:0">— '+
          (pendingNet>0 ? fmt(pendingNet,S.baseCurrency)+' por cobrar' : 'todo cobrado')+
          (paidNet>0 ? ' · '+fmt(paidNet,S.baseCurrency)+' ya cobrado' : '')+
        '</span></div>'+
        '<div class="card" style="padding:0;overflow:hidden;margin-bottom:10px">'+rows+'</div>';
    }).join('');

    return wrapClose(out);
  }

  // ---------- PENDIENTES ----------
  function renderPendientes(){
    var out = '<div class="card" style="margin-bottom:20px">'+
      '<div class="eyebrow" style="margin-bottom:12px">Agregar pendiente</div>'+
      '<form id="pendForm">'+
        '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:10px">'+
          '<div><label>Tipo</label><select name="kind"><option value="in">Por cobrar</option><option value="out">Por pagar</option></select></div>'+
          '<div><label>Concepto</label><input type="text" name="concept" placeholder="Ej. Bettys semana 34" required/></div>'+
          '<div><label>Monto</label><input type="number" step="0.01" min="0.01" name="amount" required/></div>'+
          '<div><label>Moneda</label><select name="currency">'+CURRENCIES.map(function(c){return '<option'+(c===S.baseCurrency?' selected':'')+'>'+c+'</option>';}).join('')+'</select></div>'+
          '<div><label>Cuenta</label><select name="accountId">'+S.accounts.map(function(a){return '<option value="'+a.id+'">'+esc(a.name)+'</option>';}).join('')+'</select></div>'+
          '<div><label>Fecha esperada</label><input type="date" name="dueDate" required/></div>'+
          '<div><label>Se repite</label><select name="recurrence">'+
            '<option value="none">No se repite</option>'+
            '<option value="weekly">Cada semana</option>'+
            '<option value="monthly">Cada mes</option>'+
          '</select></div>'+
        '</div>'+
        '<button type="submit" class="btn">Agregar pendiente</button>'+
      '</form>'+
    '</div>';

    var open = S.pending.filter(function(p){return p.status==='open';}).sort(function(a,b){return a.dueDate.localeCompare(b.dueDate);});
    var cobrar = open.filter(function(p){return p.kind==='in';});
    var pagar = open.filter(function(p){return p.kind==='out';});

    var totalCobrar = cobrar.reduce(function(s,p){return s+convert(p.amount,p.currency,S.baseCurrency);},0);
    var totalPagar = pagar.reduce(function(s,p){return s+convert(p.amount,p.currency,S.baseCurrency);},0);

    out += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px">'+
      metricCard('Por cobrar', fmt(totalCobrar, S.baseCurrency), '#0F6E66')+
      metricCard('Por pagar', fmt(totalPagar, S.baseCurrency), '#B23A2E')+
      metricCard('Neto pendiente', fmt(totalCobrar-totalPagar, S.baseCurrency), (totalCobrar-totalPagar)>=0?'#0F6E66':'#B23A2E')+
    '</div>';

    out += renderPendList('Por cobrar', cobrar, '#0F6E66');
    out += renderPendList('Por pagar', pagar, '#B23A2E');

    var resolved = S.pending.filter(function(p){return p.status==='resolved';});
    if(resolved.length){
      out += '<details style="margin-top:10px"><summary class="eyebrow" style="cursor:pointer">Ver '+resolved.length+' resueltos</summary>';
      out += renderPendList('', resolved, '#8A8272', true);
      out += '</details>';
    }

    return wrapClose(out);
  }

  function renderPendList(title, items, color, isResolved){
    var out = '';
    if(title) out += '<div class="eyebrow" style="margin:18px 0 10px">'+title+' ('+items.length+')</div>';
    if(items.length===0 && !isResolved){
      out += emptyState('Nada pendiente aquí.', 'Agrégalo arriba en cuanto sepas que viene.');
      return out;
    }
    out += '<div class="card" style="padding:0;overflow:hidden;margin-bottom:6px">';
    out += items.map(function(p){
      var acc = accountById(p.accountId);
      var days = Math.ceil((new Date(p.dueDate) - new Date())/86400000);
      var daysLabel = isResolved ? 'resuelto' : (days<0 ? 'atrasado '+Math.abs(days)+' días' : (days===0?'hoy':'en '+days+' días'));
      var recLabel = (p.recurrence && p.recurrence!=='none') ? (' · repite '+(p.recurrence==='weekly'?'cada semana':'cada mes')) : '';
      return '<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #F0ECE0">'+
        '<div>'+
          '<div style="font-size:13px;font-weight:600">'+esc(p.concept)+recLabel+'</div>'+
          '<div class="mono" style="font-size:11px;color:#8A8272">'+p.dueDate+' · '+(acc?esc(acc.name):'—')+' · '+daysLabel+'</div>'+
        '</div>'+
        '<div style="display:flex;align-items:center;gap:10px">'+
          '<div class="mono" style="font-weight:700;color:'+color+'">'+fmt(p.amount, p.currency)+'</div>'+
          (isResolved ? '' : '<button class="btn-ghost" data-resolve-pend="'+p.id+'">Ya '+(p.kind==='in'?'cobré':'pagué')+'</button>')+
          '<button class="btn-danger" data-del-pend="'+p.id+'">Eliminar</button>'+
        '</div>'+
      '</div>';
    }).join('');
    out += '</div>';
    return out;
  }

  // ---------- PROYECCIÓN ----------
  var proyTargetDate = (function(){ var d=new Date(); d.setDate(d.getDate()+14); return d.toISOString().slice(0,10); })();
  var proyTargetBalance = 0;

  function todayStr(){ return new Date().toISOString().slice(0,10); }

  function buildTimeline(targetDate){
    var events = [];
    var liquidTotal = 0;
    S.accounts.forEach(function(a){
      var bal = S.transactions.filter(function(t){return t.accountId===a.id;}).reduce(function(sum,t){
        var sign = t.type==='income' ? 1 : -1;
        return sum + sign*t.amount;
      }, 0);
      liquidTotal += convert(bal, a.currency, S.baseCurrency);
    });
    events.push({date: todayStr(), label:'Saldo líquido hoy', amount: liquidTotal});
    expandPendingOccurrences(targetDate).forEach(function(o){
      var v = convert(o.amount, o.currency, S.baseCurrency);
      events.push({date: o.dueDate, label: o.concept+(o.recurrence!=='none'?' (recurrente)':''), amount: o.kind==='in' ? v : -v});
    });
    S.shifts.filter(function(s){ return !s.paid; }).forEach(function(s){
      var pay = shiftPay(s);
      if(pay.payDate <= targetDate){
        var job = jobById(s.jobId);
        var v = convert(pay.net, pay.currency, S.baseCurrency);
        events.push({date: pay.payDate, label: (job?job.name:'Turno')+' · '+s.date, amount: v});
      }
    });
    events.sort(function(a,b){ return a.date.localeCompare(b.date); });
    var running = 0;
    var points = events.map(function(e){ running += e.amount; return {date:e.date, label:e.label, delta:e.amount, balance:running}; });
    return points;
  }

  function renderProyeccion(){
    var points = buildTimeline(proyTargetDate);
    var projected = points.length ? points[points.length-1].balance : 0;
    var gap = proyTargetBalance - projected;

    var out = '<div class="card" style="margin-bottom:20px">'+
      '<div class="eyebrow" style="margin-bottom:12px">¿Voy en verde?</div>'+
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:6px">'+
        '<div><label>Fecha objetivo</label><input type="date" id="proyDate" value="'+proyTargetDate+'"/></div>'+
        '<div><label>Saldo objetivo ('+S.baseCurrency+')</label><input type="number" step="1" id="proyBalance" value="'+proyTargetBalance+'"/></div>'+
      '</div>'+
    '</div>';

    out += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px">'+
      metricCard('Proyectado al '+proyTargetDate, fmt(projected, S.baseCurrency), projected>=proyTargetBalance?'#0F6E66':'#B23A2E')+
      (gap>0 ? metricCard('Te falta', fmt(gap, S.baseCurrency), '#B23A2E') : metricCard('Vas sobrado por', fmt(-gap, S.baseCurrency), '#0F6E66'))+
    '</div>';

    out += '<div class="card" style="margin-bottom:22px"><canvas id="balanceChart" height="180"></canvas></div>';

    if(gap > 0){
      out += '<div class="eyebrow" style="margin-bottom:10px">Cuántas horas necesitas</div>';
      if(S.jobs.length===0){
        out += emptyState('No tienes trabajos configurados.', 'Agrega uno en Cuentas → Trabajos, con su tarifa por hora.');
      } else {
        out += '<div class="card">' + S.jobs.map(function(j){
          var netRateOwn = (j.rates?j.rates.weekday:0) * (1 - j.taxRate);
          var netRateBase = convert(netRateOwn, j.currency, S.baseCurrency);
          var hours = gap / netRateBase;
          var delay = j.payDelayDays!=null ? j.payDelayDays : 7;
          var cutoff = addDays(proyTargetDate, -delay);
          var cutoffDow = new Date(cutoff+'T00:00:00').getDay();
          var lastDateStr = addDays(cutoff, -cutoffDow); // latest Sunday (pay-period end) on/before cutoff
          var tooLate = lastDateStr < todayStr();
          return '<div style="padding:10px 0;border-bottom:1px solid #F0ECE0">'+
            '<div style="display:flex;justify-content:space-between;font-size:13px;font-weight:600"><span>'+esc(j.name)+'</span><span class="mono">~'+hours.toFixed(1)+' h</span></div>'+
            '<div style="font-size:12px;color:#8A8272;margin-top:2px">'+fmt(netRateOwn, j.currency)+'/h neto est. (tarifa entre semana; menos horas si consigues turnos de sábado/domingo) · '+
              (tooLate ? '<span style="color:#B23A2E">ya no hay semana de pago que alcance a llegar antes del '+proyTargetDate+' (pagan ~'+delay+'d después del domingo de cada semana)</span>' : 'trabájalo en la semana que termina el '+lastDateStr+' o antes, para que ese pago llegue a tiempo')+
            '</div>'+
          '</div>';
        }).join('') + '</div>';
      }
    } else {
      out += emptyState('Vas en verde para esta fecha.', 'Con lo que ya tienes confirmado te alcanza. Puedes mover la fecha objetivo más lejos para planear con más margen.');
    }

    out += '<div class="eyebrow" style="margin:22px 0 10px">Movimientos que arman esta proyección</div>';
    out += '<div class="card" style="padding:0;overflow:hidden">';
    out += points.map(function(p){
      var color = p.delta>=0 ? '#0F6E66' : '#B23A2E';
      return '<div style="display:flex;justify-content:space-between;padding:10px 16px;border-bottom:1px solid #F0ECE0;font-size:13px">'+
        '<span>'+p.date+' · '+esc(p.label)+'</span>'+
        '<span class="mono" style="color:'+color+'">'+(p.delta>=0?'+':'')+fmt(p.delta, S.baseCurrency)+' → '+fmt(p.balance, S.baseCurrency)+'</span>'+
      '</div>';
    }).join('');
    out += '</div>';

    return wrapClose(out);
  }

  function drawBalanceChart(){
    var canvas = document.getElementById('balanceChart');

  function parseCSV(text){
    var lines = text.split(/\r?\n/).filter(function(l){return l.trim().length;});
    if(!lines.length) return {headers:[],rows:[]};
    function parseLine(line){
      var out=[], cur='', inQ=false;
      for(var i=0;i<line.length;i++){
        var c = line[i];
        if(c==='"'){ inQ = !inQ; }
        else if(c===',' && !inQ){ out.push(cur); cur=''; }
        else cur+=c;
      }
      out.push(cur);
      return out.map(function(s){return s.trim();});
    }
    var headers = parseLine(lines[0]);
    var rows = lines.slice(1).map(parseLine);
    return {headers:headers, rows:rows};
  }

  function guessCol(headers, keywords){
    for(var i=0;i<headers.length;i++){
      var h = headers[i].toLowerCase();
      for(var k=0;k<keywords.length;k++){
        if(h.indexOf(keywords[k])>-1) return i;
      }
    }
    return 0;
  }

  function bindEvents(){

    });

    var proyBalance = document.getElementById('proyBalance');
    if(proyBalance) proyBalance.addEventListener('change', function(){ proyTargetBalance = parseFloat(this.value)||0; render(); });

    var txForm = document.getElementById('txForm');
    if(txForm){
      var typeSel = document.getElementById('txType');
      typeSel.addEventListener('change', function(){
        var wrap = document.getElementById('txCategoryWrap');
        var cats = this.value==='income' ? INCOME_CATS : (this.value==='saving' ? S.goals.map(function(g){return g.name;}) : EXPENSE_CATS);
        if(this.value==='saving' && S.goals.length===0){
          wrap.innerHTML = '<label>Categoría</label><input type="text" name="category" value="Ahorro general"/>';
        } else {
          wrap.innerHTML = '<label>Categoría</label><select name="category">'+cats.map(function(c){return '<option>'+esc(c)+'</option>';}).join('')+'</select>';
        }
      });
      txForm.addEventListener('submit', function(e){
        e.preventDefault();
        var f = new FormData(txForm);
        var accountId = f.get('accountId');
        var acc = accountById(accountId);
        var type = f.get('type');
        var category = f.get('category');
        var goalId = null;
        if(type==='saving'){
          var g = S.goals.find(function(g){return g.name===category;});
          if(g) goalId = g.id;
        }
        S.transactions.push({
          id: uid(), date: f.get('date'), accountId: accountId, type: type,
          category: category, amount: parseFloat(f.get('amount')), currency: acc.currency,
          note: f.get('note')||'', goalId: goalId
        });
        save(); render();
      });
    }

    var shiftForm = document.getElementById('shiftForm');
    if(shiftForm){
      shiftForm.addEventListener('submit', function(e){
        e.preventDefault();
        var f = new FormData(shiftForm);
        var startTime = f.get('startTime'), endTime = f.get('endTime');
        if(!startTime || !endTime){ alert('Faltan horas.'); return; }
        S.shifts.push({
          id: uid(), jobId: f.get('jobId'), date: f.get('date'),
          startTime: startTime, endTime: endTime,
          isHoliday: f.get('isHoliday')==='on',
          note: f.get('note')||'', paid:false
        });
        save(); render();
      });
    }

    document.querySelectorAll('[data-paid-shift]').forEach(function(el){
      el.addEventListener('click', function(){
        var s = shiftById(el.getAttribute('data-paid-shift'));
        if(!s) return;
        var job = jobById(s.jobId);
        var pay = shiftPay(s);
        if(job){
          var acc = S.accounts.find(function(a){return a.currency===job.currency;}) || S.accounts[0];
          S.transactions.push({
            id: uid(), date: todayStr(), accountId: acc.id, type:'income',
            category: 'Sueldo/Shifts', amount: convert(pay.net, pay.currency, acc.currency),
            currency: acc.currency, note: job.name+' · '+s.date, goalId: null
          });
        }
        s.paid = true;
        save(); render();
      });
    });

    document.querySelectorAll('[data-del-shift]').forEach(function(el){
      el.addEventListener('click', function(){
        var id = el.getAttribute('data-del-shift');
        S.shifts = S.shifts.filter(function(s){return s.id!==id;});
        save(); render();
      });
    });

    var pendForm = document.getElementById('pendForm');
    if(pendForm){
      pendForm.addEventListener('submit', function(e){
        e.preventDefault();
        var f = new FormData(pendForm);
        S.pending.push({
          id: uid(), kind: f.get('kind'), concept: f.get('concept'),
          amount: parseFloat(f.get('amount')), currency: f.get('currency'),
          accountId: f.get('accountId'), dueDate: f.get('dueDate'), status: 'open',
          recurrence: f.get('recurrence')||'none'
        });
        save(); render();
      });
    }

    document.querySelectorAll('[data-resolve-pend]').forEach(function(el){
      el.addEventListener('click', function(){
        var id = el.getAttribute('data-resolve-pend');
        var p = S.pending.find(function(x){return x.id===id;});
        if(!p) return;
        var acc = accountById(p.accountId);
        S.transactions.push({
          id: uid(), date: new Date().toISOString().slice(0,10), accountId: p.accountId,
          type: p.kind==='in' ? 'income' : 'expense',
          category: p.kind==='in' ? 'Sueldo/Shifts' : 'Otros',
          amount: convert(p.amount, p.currency, acc.currency), currency: acc.currency,
          note: p.concept, goalId: null
        });
        if(p.recurrence && p.recurrence!=='none'){
          p.dueDate = p.recurrence==='weekly' ? addDays(p.dueDate,7) : addMonths(p.dueDate,1);
        } else {
          p.status = 'resolved';
        }
        save(); render();
      });
    });

    document.querySelectorAll('[data-del-pend]').forEach(function(el){
      el.addEventListener('click', function(){
        var id = el.getAttribute('data-del-pend');
        S.pending = S.pending.filter(function(p){return p.id!==id;});
        save(); render();
      });
    });

    var csvFile = document.getElementById('csvFile');
    if(csvFile){
      csvFile.addEventListener('change', function(){
        var file = this.files[0];
        if(!file) return;
        var accId = document.getElementById('importAccount').value;
        var reader = new FileReader();
        reader.onload = function(e){
          var parsed = parseCSV(e.target.result);
          if(!parsed.headers.length){ alert('No se pudo leer el archivo.'); return; }
          importState = {
            filename: file.name, headers: parsed.headers, rows: parsed.rows, accountId: accId,
            map: {
              date: guessCol(parsed.headers, ['fecha','date']),
              desc: guessCol(parsed.headers, ['desc','concepto','detalle','merchant']),
              amount: guessCol(parsed.headers, ['monto','amount','importe','value'])
            },
            signConv: 'pos-income'
          };
          render();
        };
        reader.readAsText(file);
      });
    }

    document.querySelectorAll('[data-map]').forEach(function(el){
      el.addEventListener('change', function(){
        importState.map[el.getAttribute('data-map')] = parseInt(el.value,10);
      });
    });
    var signSel = document.getElementById('signConv');
    if(signSel) signSel.addEventListener('change', function(){ importState.signConv = this.value; });

    var cancelImp = document.getElementById('cancelImport');
    if(cancelImp) cancelImp.addEventListener('click', function(){ importState = null; render(); });

    var confirmImp = document.getElementById('confirmImport');
    if(confirmImp) confirmImp.addEventListener('click', function(){
      var acc = accountById(importState.accountId);
      var added = 0;
      importState.rows.forEach(function(r){
        var rawDate = r[importState.map.date] || '';
        var rawAmount = r[importState.map.amount] || '0';
        var desc = r[importState.map.desc] || '';
        var amt = parseFloat(rawAmount.replace(/[^0-9.\-]/g,''));
        if(isNaN(amt) || amt===0) return;
        var isIncome = importState.signConv==='pos-income' ? amt>0 : amt<0;
        var date = normalizeDate(rawDate);
        S.transactions.push({
          id: uid(), date: date, accountId: acc.id, type: isIncome?'income':'expense',
          category: 'Sin categorizar', amount: Math.abs(amt), currency: acc.currency,
          note: desc, goalId: null
        });
        added++;
      });
      save();
      importState = null;
      activeTab = 'movimientos';
      render();
    });

    document.querySelectorAll('[data-del-tx]').forEach(function(el){
      el.addEventListener('click', function(){
        var id = el.getAttribute('data-del-tx');
        S.transactions = S.transactions.filter(function(t){return t.id!==id;});
        save(); render();
      });
    });

    var goalForm = document.getElementById('goalForm');
    if(goalForm){
      goalForm.addEventListener('submit', function(e){
        e.preventDefault();
        var f = new FormData(goalForm);
        S.goals.push({id:uid(), name:f.get('name'), target:parseFloat(f.get('target')), currency:f.get('currency'), date:f.get('date')});
        save(); render();
      });
    }

    document.querySelectorAll('[data-del-goal]').forEach(function(el){
      el.addEventListener('click', function(){
        var id = el.getAttribute('data-del-goal');
        if(!confirm('¿Eliminar esta meta? Las aportaciones ya registradas se quedan como ahorro sin meta.')) return;
        S.goals = S.goals.filter(function(g){return g.id!==id;});
        S.transactions.forEach(function(t){ if(t.goalId===id) t.goalId=null; });
        save(); render();
      });
    });

    document.querySelectorAll('[data-add-contrib]').forEach(function(el){
      el.addEventListener('click', function(){
        var goalId = el.getAttribute('data-add-contrib');
        var g = goalById(goalId);
        var amountStr = prompt('¿Cuánto quieres aportar a "'+g.name+'"? (en '+g.currency+')');
        if(!amountStr) return;
        var amount = parseFloat(amountStr);
        if(isNaN(amount) || amount<=0){ alert('Monto inválido.'); return; }
        var accNames = S.accounts.map(function(a,i){return (i+1)+') '+a.name;}).join('\n');
        var accIdxStr = prompt('¿De qué cuenta sale el dinero?\n'+accNames);
        var accIdx = parseInt(accIdxStr,10)-1;
        var acc = S.accounts[accIdx];
        if(!acc){ alert('Cuenta inválida.'); return; }
        S.transactions.push({
          id: uid(), date: new Date().toISOString().slice(0,10), accountId: acc.id, type:'saving',
          category: g.name, amount: convert(amount, g.currency, acc.currency), currency: acc.currency,
          note: 'Aportación a '+g.name, goalId: g.id
        });
        save(); render();
      });
    });

    document.querySelectorAll('[data-acc-name]').forEach(function(el){
      el.addEventListener('change', function(){
        var a = accountById(el.getAttribute('data-acc-name'));
        a.name = el.value; save();
      });
    });
    document.querySelectorAll('[data-acc-cur]').forEach(function(el){
      el.addEventListener('change', function(){
        var a = accountById(el.getAttribute('data-acc-cur'));
        a.currency = el.value; save(); render();
      });
    });
    document.querySelectorAll('[data-job-name]').forEach(function(el){
      el.addEventListener('change', function(){ jobById(el.getAttribute('data-job-name')).name = el.value; save(); });
    });
    document.querySelectorAll('[data-job-r-weekday]').forEach(function(el){
      el.addEventListener('change', function(){ var v=parseFloat(el.value); if(!isNaN(v)) { jobById(el.getAttribute('data-job-r-weekday')).rates.weekday = v; save(); } });
    });
    document.querySelectorAll('[data-job-r-thr]').forEach(function(el){
      el.addEventListener('change', function(){ var v=parseInt(el.value,10); if(!isNaN(v)) { jobById(el.getAttribute('data-job-r-thr')).rates.eveningThresholdHour = v; save(); } });
    });
    document.querySelectorAll('[data-job-r-evening]').forEach(function(el){
      el.addEventListener('change', function(){ var v=parseFloat(el.value); if(!isNaN(v)) { jobById(el.getAttribute('data-job-r-evening')).rates.weekdayEvening = v; save(); } });
    });
    document.querySelectorAll('[data-job-r-late]').forEach(function(el){
      el.addEventListener('change', function(){ var v=parseFloat(el.value); if(!isNaN(v)) { jobById(el.getAttribute('data-job-r-late')).rates.lateNight = v; save(); } });
    });
    document.querySelectorAll('[data-job-r-sat]').forEach(function(el){
      el.addEventListener('change', function(){ var v=parseFloat(el.value); if(!isNaN(v)) { jobById(el.getAttribute('data-job-r-sat')).rates.saturday = v; save(); } });
    });
    document.querySelectorAll('[data-job-r-sun]').forEach(function(el){
      el.addEventListener('change', function(){ var v=parseFloat(el.value); if(!isNaN(v)) { jobById(el.getAttribute('data-job-r-sun')).rates.sunday = v; save(); } });
    });
    document.querySelectorAll('[data-job-r-ph]').forEach(function(el){
      el.addEventListener('change', function(){ var v=parseFloat(el.value); if(!isNaN(v)) { jobById(el.getAttribute('data-job-r-ph')).rates.publicHoliday = v; save(); } });
    });
    document.querySelectorAll('[data-job-cur]').forEach(function(el){
      el.addEventListener('change', function(){ jobById(el.getAttribute('data-job-cur')).currency = el.value; save(); });
    });
    document.querySelectorAll('[data-job-tax]').forEach(function(el){
      el.addEventListener('change', function(){ var v=parseFloat(el.value); if(!isNaN(v)) { jobById(el.getAttribute('data-job-tax')).taxRate = v; save(); } });
    });
    document.querySelectorAll('[data-job-lag]').forEach(function(el){
      el.addEventListener('change', function(){ var v=parseInt(el.value,10); if(!isNaN(v)) { jobById(el.getAttribute('data-job-lag')).payDelayDays = v; save(); } });
    });
    document.querySelectorAll('[data-del-job]').forEach(function(el){
      el.addEventListener('click', function(){
        S.jobs = S.jobs.filter(function(j){return j.id!==el.getAttribute('data-del-job');});
        save(); render();
      });
    });
    var addJobBtn = document.getElementById('addJob');
    if(addJobBtn) addJobBtn.addEventListener('click', function(){
      S.jobs.push({id:uid(), name:'Nuevo trabajo', currency:S.baseCurrency, taxRate:0.15, payDelayDays:7, tag:TAGS[S.jobs.length % TAGS.length], rates:{weekday:0, eveningThresholdHour:19, weekdayEvening:0, lateNight:0, saturday:0, sunday:0, publicHoliday:0}});
      save(); render();
    });

    var baseSel = document.getElementById('baseCurSel');
    if(baseSel) baseSel.addEventListener('change', function(){ S.baseCurrency = this.value; save(); render(); });

    document.querySelectorAll('[data-rate]').forEach(function(el){
      el.addEventListener('change', function(){
        var cur = el.getAttribute('data-rate');
        var v = parseFloat(el.value);
        if(!isNaN(v) && v>0){ S.rates[cur] = v; save(); render(); }
      });
    });

    var resetBtn = document.getElementById('resetData');
    if(resetBtn) resetBtn.addEventListener('click', function(){
      if(confirm('Esto borra todos tus movimientos, cuentas y metas. ¿Seguro?')){
        S = defaultState(); save(); activeTab='dashboard'; render();
      }
    });
  }

  function normalizeDate(raw){
    raw = raw.trim();
    var iso = /^(\d{4})-(\d{2})-(\d{2})/.exec(raw);
    if(iso) return iso[1]+'-'+iso[2]+'-'+iso[3];
    var dmy = /^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/.exec(raw);
    if(dmy) return dmy[3]+'-'+pad(dmy[2])+'-'+pad(dmy[1]);
    var d = new Date(raw);
    if(!isNaN(d)) return d.toISOString().slice(0,10);
    return new Date().toISOString().slice(0,10);
  }
  function pad(n){ n=String(n); return n.length<2 ? '0'+n : n; }

  load();
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){
    // Probe first so environments that don't actually serve sw.js (e.g. preview sandboxes)
    // don't throw a noisy 404 registration error — real deployments (GitHub Pages, etc.) register normally.
    fetch("sw.js", {method:"HEAD"}).then(function(res){
      if(res && res.ok){
        navigator.serviceWorker.register("sw.js").catch(function(){ /* non-critical: app works fine without offline caching */ });
      }
    }).catch(function(){ /* sw.js not reachable here, skip silently */ });
  });
}
</script>
